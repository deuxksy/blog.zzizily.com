name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"] # main 브랜치에 push될 때 실행
  workflow_dispatch:      # 수동 실행 버튼 활성화

# GITHUB_TOKEN에 대한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 실행 방지 (빌드가 겹치면 이전 빌드 취소)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # PaperMod 테마를 위해 서브모듈을 재귀적으로 가져옴
          fetch-depth: 0        # Git 히스토리를 전부 가져옴 (마지막 수정일 반영 용도)

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true        # PaperMod의 SCSS 빌드를 위해 extended 버전 필수

      - name: Build with Hugo
        run: hugo --minify --baseURL "https://blog.zzizily.com/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        